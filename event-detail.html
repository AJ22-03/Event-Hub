<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Details - EventHub</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="index.html" class="navbar-logo">
      <i class="fa-solid fa-tent"></i> EventHub
    </a>
    <div class="hamburger" id="hamburger">
      <span></span><span></span><span></span>
    </div>
    <div class="nav-links" id="nav-menu">
      <a href="index.html" class="nav-link">Home</a>
      <a href="events.html" class="nav-link active">Events</a>
      <a href="events.html#map" class="nav-link">Map</a>
      <div id="nav-auth"></div>
    </div>
  </nav>

  <div id="content"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      EventHub.initNavbar();
      
      const urlParams = new URLSearchParams(window.location.search);
      const evId = urlParams.get('id');
      const ev = EventHub.getEventById(evId);
      
      if (!ev) {
        document.getElementById('content').innerHTML = `
          <div style="padding:120px 20px; text-align:center;">
            <h1 style="color:var(--error);">Event Not Found</h1>
            <p>The event you are looking for does not exist or has been removed.</p>
            <a href="events.html" class="btn btn-primary mt-4">Browse Events</a>
          </div>`;
        return;
      }

      document.title = `${ev.title} - EventHub`;

      const user = EventHub.getCurrentUser();
      const isOrganizer = user && user.role === 'organizer' && ev.organizerId === user.id;
      const isAdmin = user && user.role === 'admin';
      const isAttendee = user && user.role === 'user';
      
      let regs = [];
      if (user) {
        regs = EventHub.getUserRegistrations(user.id);
      }
      const isRegistered = regs.find(r => r.eventId === ev.id && r.status !== 'cancelled');

      let statusBadge = '';
      if (ev.status === 'pending') statusBadge = '<span class="badge badge-warning">Pending Approval</span>';
      else if (ev.status === 'rejected') statusBadge = '<span class="badge badge-danger">Rejected</span>';
      else if (ev.status === 'cancelled') statusBadge = '<span class="badge badge-secondary">Cancelled</span>';

      const bg = EventHub.getCategoryColor(ev.category);
      
      let rightCardHtml = '';
      
      if (isOrganizer) {
        rightCardHtml = `
          <div class="reg-card">
            <h3>Organizer Actions</h3>
            <p class="text-muted mb-4">You are the organizer of this event.</p>
            <div style="display:flex;gap:10px;flex-direction:column;">
              <button class="btn btn-outline" onclick="window.location.href='dashboard.html#organizer-events'">Manage Event in Dashboard</button>
            </div>
          </div>
        `;
      } else if (isAdmin && ev.status === 'pending') {
        rightCardHtml = `
          <div class="reg-card">
            <h3>Admin Actions</h3>
            <p class="text-muted mb-4">Review and approve this event.</p>
            <div style="display:flex;gap:10px;">
              <button class="btn btn-success flex-1" style="flex:1;" onclick="doApprove('${ev.id}')">Approve</button>
              <button class="btn btn-danger flex-1" style="flex:1;" onclick="doReject('${ev.id}')">Reject</button>
            </div>
          </div>
        `;
      } else {
        // Standard Attendee View
        let seatsPercent = (ev.availableSeats / ev.totalSeats) * 100;
        let seatColor = seatsPercent > 50 ? 'var(--success)' : (seatsPercent > 20 ? 'var(--warning)' : 'var(--error)');
        
        let actionArea = '';
        if (ev.status !== 'approved') {
          actionArea = `<div class="badge badge-warning" style="width:100%; justify-content:center; padding:12px; font-size:1rem;">Event Not Available</div>`;
        } else if (isRegistered) {
          let pStatus = '';
          if(isRegistered.paymentStatus === 'pending') pStatus = '<div class="badge badge-warning">Payment Verification Pending</div>';
          else if(isRegistered.paymentStatus === 'verified') pStatus = '<div class="badge badge-success">Payment Verified ✅</div>';
          else if(isRegistered.paymentStatus === 'rejected') pStatus = '<div class="badge badge-danger">Payment Rejected</div>';
          
          actionArea = `
            <div style="background:rgba(16,185,129,0.1); border:1px solid rgba(16,185,129,0.3); padding:20px; border-radius:12px; text-align:center;">
              <div style="font-size:2rem; margin-bottom:10px;">🎉</div>
              <h4 style="color:#34d399; margin-bottom:8px;">You are registered!</h4>
              ${pStatus}
              <button class="btn btn-outline-sm mt-4" onclick="window.location.href='dashboard.html#user-registrations'">View Ticket</button>
            </div>
          `;
        } else if (!user) {
          actionArea = `<a href="login.html" class="btn btn-primary btn-full">Login to Register</a>`;
        } else if (!isAttendee) {
          actionArea = `<div class="badge badge-secondary" style="width:100%; justify-content:center; padding:12px;">Login as Attendee to Register</div>`;
        } else if (ev.availableSeats <= 0) {
          actionArea = `<div class="btn btn-danger btn-full" disabled>Sold Out</div>`;
        } else {
          // Registration Form
          let paymentHtml = '';
          if (ev.fee > 0) {
            paymentHtml = `
              <div style="background:rgba(255,255,255,0.05); padding:16px; border-radius:8px; margin-bottom:20px; border:1px dashed var(--dark-border);">
                <p style="font-size:0.85rem; margin-bottom:10px;">This is a paid event. Please pay <strong>${EventHub.formatCurrency(ev.fee)}</strong> via UPI to <strong>eventhub@upi</strong>.</p>
                <div class="form-group" style="margin-bottom:0;">
                  <input type="text" id="pay-ref" class="form-control" placeholder="Enter UPI Reference Number" required>
                </div>
              </div>
            `;
          }
          
          actionArea = `
            <form id="reg-form" onsubmit="handleRegister(event, '${ev.id}', ${ev.fee})">
              <div class="form-group">
                <label>Name</label>
                <input type="text" class="form-control" value="${user.name}" disabled>
              </div>
              <div class="form-group">
                <label>Email</label>
                <input type="email" class="form-control" value="${user.email}" disabled>
              </div>
              ${paymentHtml}
              <button type="submit" class="btn btn-primary btn-full" id="btn-reg">Register Now</button>
            </form>
          `;
        }
        
        rightCardHtml = `
          <div class="reg-card">
            <div class="price-display">${EventHub.formatCurrency(ev.fee)}</div>
            <p class="text-muted" style="margin-bottom:24px;">Registration Fee</p>
            
            <div style="margin-bottom:24px;">
              <div class="flex-between" style="font-size:0.85rem; margin-bottom:8px;">
                <span>Seats Available</span>
                <span style="font-weight:600;">${ev.availableSeats} / ${ev.totalSeats}</span>
              </div>
              <div class="progress-bar">
                <div class="progress-bar-fill" style="width:${seatsPercent}%; background:${seatColor}"></div>
              </div>
            </div>
            
            ${actionArea}
          </div>
        `;
      }

      document.getElementById('content').innerHTML = `
        <div class="event-hero" style="background:${bg}">
          <div class="event-hero-overlay"></div>
          <div class="event-hero-content container" style="width:100%;">
            <div class="breadcrumb" style="margin-bottom:16px; color:rgba(255,255,255,0.7);"><a href="index.html" style="color:rgba(255,255,255,0.7);">Home</a> &gt; <a href="events.html" style="color:rgba(255,255,255,0.7);">Events</a> &gt; <span style="color:#fff;">${ev.title}</span></div>
            <div class="badge" style="background:rgba(255,255,255,0.2); color:#fff; border:none; margin-bottom:12px; backdrop-filter:blur(4px);">
              ${EventHub.getCategoryIcon(ev.category)} ${ev.category}
            </div>
            ${statusBadge}
            <h1 style="color:#fff; margin-bottom:16px;">${ev.title}</h1>
            <div style="display:flex; gap:24px; color:rgba(255,255,255,0.9); font-size:1.1rem; flex-wrap:wrap;">
              <div><i class="fa-regular fa-calendar"></i> ${EventHub.formatDate(ev.date)}</div>
              <div><i class="fa-regular fa-clock"></i> ${EventHub.formatTime(ev.time)} - ${EventHub.formatTime(ev.endTime)}</div>
              <div><i class="fa-solid fa-location-dot"></i> ${ev.location}</div>
            </div>
          </div>
        </div>
        
        <div class="detail-layout">
          <div class="detail-main">
            <h2 style="margin-bottom:20px;">About Event</h2>
            <div style="font-size:1.05rem; line-height:1.8; color:var(--text-secondary); margin-bottom:40px; white-space:pre-wrap;">${ev.description}</div>
            
            <div class="grid-2 mb-8">
              <div class="card" style="padding:20px;">
                <div style="width:40px;height:40px;border-radius:10px;background:rgba(124,58,237,0.15);display:flex;align-items:center;justify-content:center;color:var(--primary-light);font-size:1.2rem;margin-bottom:12px;"><i class="fa-solid fa-location-crosshairs"></i></div>
                <h4 style="margin-bottom:4px;">Venue</h4>
                <p style="font-size:0.9rem; color:var(--text-secondary);">${ev.venue}<br>${ev.location}</p>
              </div>
              <div class="card" style="padding:20px; display:flex; align-items:center; gap:16px;">
                <div style="width:50px;height:50px;border-radius:50%;background:var(--gradient);display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.2rem;font-weight:700;">${ev.organizerName.charAt(0)}</div>
                <div>
                  <div style="font-size:0.8rem; color:var(--text-secondary);">Organized by</div>
                  <h4 style="margin:0;">${ev.organizerName}</h4>
                </div>
              </div>
            </div>
            
            <h3 style="margin-bottom:16px;">Location Map</h3>
            <div class="map-container" id="ev-map" style="height:300px; margin-bottom:40px;"></div>
            
            <h3 style="margin-bottom:16px;">Share Event</h3>
            <div style="display:flex; gap:12px;">
              <a href="#" class="btn btn-outline-sm" style="color:#1DA1F2; border-color:rgba(29,161,242,0.3);"><i class="fa-brands fa-twitter"></i> Twitter</a>
              <a href="#" class="btn btn-outline-sm" style="color:#4267B2; border-color:rgba(66,103,178,0.3);"><i class="fa-brands fa-facebook"></i> Facebook</a>
              <a href="#" class="btn btn-outline-sm" style="color:#25D366; border-color:rgba(37,211,102,0.3);"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
            </div>
          </div>
          
          <div class="detail-sidebar">
            ${rightCardHtml}
          </div>
        </div>
      `;

      if (ev.lat && ev.lng) {
        const map = L.map('ev-map').setView([ev.lat, ev.lng], 14);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);
        L.marker([ev.lat, ev.lng]).addTo(map).bindPopup(ev.venue).openPopup();
      }
    });

    function handleRegister(e, evId, fee) {
      e.preventDefault();
      const user = EventHub.getCurrentUser();
      if (!user) return;
      
      let proof = '';
      if (fee > 0) {
        proof = document.getElementById('pay-ref').value;
        if (!proof.trim()) {
          EventHub.showToast('Please enter Payment Reference Number', 'error');
          return;
        }
      }
      
      const btn = document.getElementById('btn-reg');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';
      
      setTimeout(() => {
        const res = EventHub.registerForEvent(user.id, evId);
        if (res.success) {
          if (fee > 0) {
            EventHub.submitPaymentProof(res.registration.id, proof);
          }
          EventHub.showToast('Registration successful!', 'success');
          setTimeout(() => { window.location.reload(); }, 1500);
        } else {
          EventHub.showToast(res.error, 'error');
          btn.disabled = false;
          btn.innerHTML = 'Register Now';
        }
      }, 1000);
    }
    
    function doApprove(evId) {
      EventHub.showModal('Approve Event', 'Are you sure you want to approve this event? It will become visible to the public.', () => {
        EventHub.approveEvent(evId);
        EventHub.showToast('Event approved', 'success');
        setTimeout(() => window.location.reload(), 1000);
      });
    }

    function doReject(evId) {
      EventHub.showModal('Reject Event', 'Are you sure you want to reject this event?', () => {
        EventHub.rejectEvent(evId);
        EventHub.showToast('Event rejected', 'info');
        setTimeout(() => window.location.reload(), 1000);
      });
    }
  </script>
</body>
</html>
